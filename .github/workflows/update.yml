name: Nightly update

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      - name: Download lists, geocode, diff
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sanctionscope.com/' }}
        run: python pipeline/build.py

      - name: Commit data back to the repo
        run: |
          git config user.name "sanctionscope-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
